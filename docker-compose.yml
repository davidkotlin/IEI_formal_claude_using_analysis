services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ./db:/opt/IEI_claude_using_analysis/db
      - ./data/incoming:/opt/IEI_claude_using_analysis/data/incoming
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./iei_claude.crt:/etc/ssl/certs/iei_claude.crt:ro
      - ./iei_claude.key:/etc/ssl/private/iei_claude.key:ro
    depends_on:
      - backend
    restart: unless-stopped
